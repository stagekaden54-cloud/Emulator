<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Retro Player</title>
  <style>
    :root { color-scheme: dark; background: #080d15; }
    * { box-sizing: border-box; }
    html, body, #game { width: 100%; height: 100%; margin: 0; background: #080d15; overflow: hidden; }
    body { font-family: system-ui, sans-serif; }
    #status {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
      color: #e9f1fb; text-align: center; background: #080d15; z-index: 1;
    }
    #status small { display: block; color: #9caec4; margin-top: 8px; line-height: 1.5; }
    #game { position: relative; }
  </style>
</head>
<body>
  <div id="status">Loading Retro Player<small>Preparing the emulator runtime…</small></div>
  <div id="game"></div>
  <script>
    (function () {
      "use strict";
      const params = new URLSearchParams(location.search);
      const gameUrl = params.get("game") || "";
      const core = params.get("system") || "";
      const gameName = params.get("title") || "Retro Player game";
      const biosUrl = params.get("bios") || "";
      const haptics = params.get("haptics") !== "false";
      const allowedCores = new Set(["psx", "nes", "snes", "gb", "gba", "n64", "segaMD", "segaMS", "segaGG"]);
      const status = document.getElementById("status");
      if (!gameUrl || !allowedCores.has(core)) {
        status.textContent = "Unable to start this game. Return to your library and try importing it again.";
        return;
      }
      window.EJS_player = "#game";
      window.EJS_core = core;
      window.EJS_gameUrl = gameUrl;
      window.EJS_gameName = gameName;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/4.2.3/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_browserMode = "mobile";
      window.EJS_volume = Math.max(0, Math.min(1, Number(params.get("volume") || "1")));
      window.EJS_cacheConfig = { enabled: true, cacheMaxSizeMB: 512, cacheMaxAgeMins: 7200 };
      window.EJS_color = "#67b7ff";
      window.EJS_defaultOptions = { "save-state-location": "browser" };
      if (core === "psx" && biosUrl) window.EJS_biosUrl = biosUrl;

      if (haptics && navigator.vibrate) {
        document.addEventListener("pointerdown", function (event) {
          if (event.pointerType === "touch" && event.target && event.target.closest && event.target.closest("#game")) {
            navigator.vibrate(8);
          }
        }, true);
      }

      window.addEventListener("load", function () {
        window.setTimeout(function () {
          if (status && status.parentNode) status.remove();
        }, 1200);
      });
      window.addEventListener("error", function (event) {
        if (!status || !status.parentNode) return;
        status.innerHTML = "The emulator could not finish loading.<small>Check your internet connection and the game file, then try again. " +
          String(event.message || "").replace(/[<>&]/g, "") + "</small>";
      });
      const loader = document.createElement("script");
      loader.src = window.EJS_pathtodata + "loader.js";
      loader.onerror = function () {
        status.innerHTML = "Could not load the emulator runtime.<small>Connect to the internet and retry. The emulator files are loaded from the pinned EmulatorJS 4.2.3 release.</small>";
      };
      document.head.appendChild(loader);
    })();
  </script>
</body>
</html>
